<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apa nak makan tonight?</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Fredoka', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle, #fef08a 0%, #fef3c7 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      margin: 0; padding: 20px; box-sizing: border-box; text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.95); padding: 40px; border-radius: 32px;
      box-shadow: 0 20px 40px rgba(217, 119, 6, 0.15), 0 1px 3px rgba(0,0,0,0.05);
      max-width: 440px; width: 100%; border: 4px solid #f59e0b;
      animation: slideIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    h1 {
      font-size: 2.5rem; margin: 0 0 24px 0; line-height: 1.2;
      background: linear-gradient(135deg, #ea580c 0%, #db2777 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    button {
      background: linear-gradient(135deg, #f59e0b, #e11d48); color: white;
      border: none; padding: 16px 36px; font-size: 1.25rem; font-weight: 700;
      border-radius: 9999px; cursor: pointer; transition: all 0.2s ease;
      box-shadow: 0 8px 0 #b45309; margin-bottom: 30px; width: 100%; outline: none;
      animation: pulse-btn 2s infinite;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 10px 0 #b45309; animation: none; }
    button:active { transform: translateY(4px); box-shadow: 0 4px 0 #b45309; }
    #result {
      min-height: 170px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .emoji { font-size: 5.5rem; margin: 0 0 12px 0; display: inline-block; }
    .dish { font-size: 2.2rem; font-weight: 700; color: #1f2937; margin: 0; }
    .initial { font-size: 1.1rem; color: #6b7280; font-style: italic; font-weight: 500; }
    @keyframes pop {
      0% { transform: scale(0.6); opacity: 0; }
      60% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate { animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    @keyframes slideIn {
      0% { transform: translateY(40px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }
    @keyframes pulse-btn {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }
    @keyframes wiggle {
      0% { transform: rotate(-6deg) scale(1.05); }
      50% { transform: rotate(6deg) scale(1.05); }
      100% { transform: rotate(-6deg) scale(1.05); }
    }
    .spin { animation: wiggle 0.1s linear infinite; }
  </style>
</head>
<body>
  <div class="card" id="main-card">
    <h1 id="title">Apa nak makan tonight?</h1>
    <button onclick="pilih()" id="btn-pick">Pilih untuk saya!</button>
    <div id="result">
      <div class="initial" id="placeholder">Ketik butang untuk memilih makanan malam anda! 😋</div>
    </div>
  </div>
  <script>
    const dishes = [
      { name: "Nasi Lemak", emoji: "🍛" }, { name: "Roti Canai", emoji: "🫓" },
      { name: "Laksa", emoji: "🍜" }, { name: "Satay", emoji: "🍢" },
      { name: "Mee Goreng", emoji: "🍝" }, { name: "Cendol", emoji: "🍧" },
      { name: "Rendang", emoji: "🥩" }, { name: "Teh Tarik", emoji: "☕" },
      { name: "Mee Rebus", emoji: "🍜" }, { name: "Nasi Kerabu", emoji: "🍚" }
    ];
    function pilih() {
      const res = document.getElementById('result');
      const btn = document.getElementById('btn-pick');
      btn.disabled = true;
      let count = 0, interval = setInterval(() => {
        const item = dishes[Math.floor(Math.random() * dishes.length)];
        res.innerHTML = `<span class="emoji spin">${item.emoji}</span><p class="dish spin">${item.name}</p>`;
        count++;
        if (count > 8) {
          clearInterval(interval);
          const final = dishes[Math.floor(Math.random() * dishes.length)];
          res.innerHTML = `<span class="emoji animate">${final.emoji}</span><p class="dish animate">${final.name}</p>`;
          btn.disabled = false;
        }
      }, 80);
    }
  </script>
</body>
</html>
